<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1520" />
  <title>CoinLeone — Join the Family</title>
  <meta name="description" content="CoinLeone — a browser crime game. Jobs, casino, scratch. Play to earn." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0d1520;
      --navy-2: #121c2a;
      --panel: #1a2638;
      --border: #3a4a5e;
      --gold: #e8c547;
      --gold-2: #f0d56a;
      --gold-dark: #b8942e;
      --gold-glow: rgba(232, 197, 71, 0.35);
      --red: #c4282d;
      --green: #3dba6c;
      --blue: #4a9fd4;
      --text: #e8ecf2;
      --muted: #8a96a8;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: "Roboto", system-ui, sans-serif;
      background: var(--navy);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* Tiny HUD strip — guests see logo only (no faux cash/energy) */
    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: linear-gradient(180deg, #141e2c, #0a1018);
      border-bottom: 2px solid var(--gold-dark);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .hud-logo {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold-glow);
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-logo .mark {
      width: 24px;
      height: 24px;
      border-radius: 3px;
      background: linear-gradient(145deg, #e03a3f, #8b1c20);
      border: 1px solid var(--gold);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
    }

    .hud-btc {
      font-size: 0.72rem;
      font-weight: 700;
      background: #121c2a;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 8px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .hud-btc b { color: var(--gold-2); font-weight: 700; }
    .hud-btc.stale b { color: var(--muted); }
    .hud-btc .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 5px;
      vertical-align: middle;
      box-shadow: 0 0 6px rgba(61, 186, 108, 0.7);
    }
    .hud-btc.stale .dot { background: var(--muted); box-shadow: none; }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px calc(28px + var(--safe-bottom));
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .skyline {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 90px;
      pointer-events: none;
      opacity: 0.55;
    }

    .skyline svg { width: 100%; height: 100%; display: block; }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #1e2c40, var(--panel));
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold-dark);
      border-radius: 6px;
      padding: 28px 22px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    h1 {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 5vw, 2rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 1px 0 #000, 0 0 18px var(--gold-glow);
      margin-bottom: 8px;
    }

    .pitch {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    .pitch strong { color: var(--gold-2); font-weight: 500; }

    .btc-teaser {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 auto 18px;
      padding: 8px 14px;
      background: #0a1018;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }
    .btc-teaser .label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .btc-teaser .price {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--gold);
      letter-spacing: 0.02em;
    }
    .btc-teaser.stale .price { color: var(--muted); }
    .btc-teaser .live {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--green);
    }
    .btc-teaser.stale .live { color: var(--muted); }

    .hints {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: #121c2a;
      border: 1px dashed var(--border);
      border-radius: 3px;
      padding: 5px 10px;
      opacity: 0.85;
    }
    .hint span { margin-right: 3px; }
    .hint .lock { opacity: 0.7; font-size: 0.6rem; margin-left: 3px; }

    form { text-align: left; }

    .field { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #0a1018;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
    }
    input:focus { border-color: var(--gold-dark); box-shadow: 0 0 0 2px var(--gold-glow); }
    input#ref { text-transform: uppercase; letter-spacing: 0.05em; }
    input::placeholder { color: #4a5568; text-transform: none; letter-spacing: normal; }

    .cta {
      width: 100%;
      margin-top: 4px;
      padding: 13px 16px;
      font-family: "Oswald", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1a1408;
      background: linear-gradient(180deg, var(--gold-2), var(--gold-dark));
      border: 1px solid #9a7a20;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 3px 0 #6e5614, 0 6px 16px rgba(232,197,71,0.25);
    }
    .cta:hover { filter: brightness(1.06); }
    .cta:active { transform: translateY(2px); box-shadow: 0 1px 0 #6e5614; }
    .cta:disabled { opacity: 0.6; cursor: wait; }

    .msg { margin-top: 10px; font-size: 0.85rem; min-height: 1.2em; text-align: center; }
    .msg.ok { color: var(--green); }
    .msg.err { color: #e03a3f; }

    .count {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    .count b { color: var(--gold-2); }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 16px 18px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    footer a { color: var(--gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    footer .legal { margin-top: 4px; opacity: 0.75; max-width: 420px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <header class="hud">
    <div class="hud-logo"><span class="mark">♠</span> CoinLeone</div>
    <!-- Guests: no faux cash/energy. Live BTC only. -->
    <div class="hud-btc stale" id="hudBtc" title="Bitcoin (USD)" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>BTC <b id="hudBtcPrice">—</b>
    </div>
  </header>

  <main class="hero">
    <div class="skyline" aria-hidden="true">
      <svg viewBox="0 0 960 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a2840"/>
            <stop offset="100%" stop-color="#0d1520"/>
          </linearGradient>
        </defs>
        <rect x="0" y="50" width="40" height="40" fill="url(#bld)"/>
        <rect x="45" y="30" width="55" height="60" fill="url(#bld)"/>
        <rect x="105" y="45" width="35" height="45" fill="url(#bld)"/>
        <rect x="145" y="20" width="70" height="70" fill="url(#bld)"/>
        <polygon points="145,20 180,5 215,20" fill="#1a2840"/>
        <rect x="220" y="40" width="50" height="50" fill="url(#bld)"/>
        <rect x="275" y="28" width="40" height="62" fill="url(#bld)"/>
        <rect x="320" y="15" width="80" height="75" fill="url(#bld)"/>
        <rect x="405" y="35" width="45" height="55" fill="url(#bld)"/>
        <rect x="455" y="25" width="60" height="65" fill="url(#bld)"/>
        <rect x="520" y="42" width="38" height="48" fill="url(#bld)"/>
        <rect x="563" y="18" width="75" height="72" fill="url(#bld)"/>
        <polygon points="563,18 600,0 638,18" fill="#1a2840"/>
        <rect x="643" y="38" width="50" height="52" fill="url(#bld)"/>
        <rect x="698" y="22" width="55" height="68" fill="url(#bld)"/>
        <rect x="758" y="45" width="42" height="45" fill="url(#bld)"/>
        <rect x="805" y="28" width="65" height="62" fill="url(#bld)"/>
        <rect x="875" y="40" width="50" height="50" fill="url(#bld)"/>
        <rect x="930" y="50" width="30" height="40" fill="url(#bld)"/>
        <g fill="#e8c547" opacity="0.3">
          <rect x="55" y="40" width="4" height="4"/><rect x="65" y="52" width="4" height="4"/>
          <rect x="160" y="35" width="4" height="4"/><rect x="340" y="30" width="4" height="4"/>
          <rect x="470" y="40" width="4" height="4"/><rect x="600" y="50" width="4" height="4"/>
          <rect x="710" y="40" width="4" height="4"/><rect x="840" y="45" width="4" height="4"/>
        </g>
        <rect x="0" y="86" width="960" height="4" fill="#c4282d" opacity="0.55"/>
      </svg>
    </div>

    <div class="card">
      <h1>Join the Family</h1>
      <p class="pitch">Browser crime game. <strong>Play to earn</strong> — cash out when you’ve earned it.</p>

      <div class="btc-teaser stale" id="btcTeaser" aria-live="polite">
        <span class="label">BTC</span>
        <span class="price" id="btcPrice">Loading…</span>
        <span class="live" id="btcLive">·</span>
      </div>

      <div class="hints" aria-label="Coming soon">
        <div class="hint" title="Coming soon"><span>💧</span> Faucet<span class="lock">🔒</span></div>
        <div class="hint" title="Coming soon"><span>🎰</span> Casino<span class="lock">🔒</span></div>
        <div class="hint" title="Coming soon"><span>🎟️</span> Lottery<span class="lock">🔒</span></div>
      </div>

      <form id="waitlistForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@email.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="ref">Crew code (optional)</label>
          <input id="ref" name="ref" type="text" placeholder="REFERRAL" autocomplete="off" maxlength="24" />
        </div>
        <button type="submit" class="cta" id="submitBtn">Join the Family</button>
        <div class="msg" id="formMsg" role="status"></div>
      </form>

      <p class="count">Family on the list · <b id="waitCount">128</b></p>
    </div>
  </main>

  <footer>
    <p><a href="https://coinleone.com">coinleone.com</a></p>
    <p class="legal">Entertainment only. Soft cash is for play; crypto cash-out follows game rules.</p>
  </footer>

  <script>
    (function () {
      var STORAGE_KEY = "coinleone_waitlist_v1";
      var COUNT_KEY = "coinleone_waitlist_count";
      var BTC_REFRESH_MS = 60000;

      function qs(name) {
        var m = new URLSearchParams(window.location.search).get(name);
        return m ? m.trim() : "";
      }

      var refInput = document.getElementById("ref");
      var fromUrl = qs("ref") || qs("code") || qs("r");
      if (fromUrl) refInput.value = fromUrl.toUpperCase();

      function loadEntries() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch (e) {
          return [];
        }
      }

      function saveEntries(arr) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        var n = 128 + arr.length;
        localStorage.setItem(COUNT_KEY, String(n));
        document.getElementById("waitCount").textContent = n.toLocaleString();
      }

      var existing = loadEntries();
      var shown = parseInt(localStorage.getItem(COUNT_KEY) || "128", 10);
      if (existing.length) shown = Math.max(shown, 128 + existing.length);
      document.getElementById("waitCount").textContent = shown.toLocaleString();

      var form = document.getElementById("waitlistForm");
      var msg = document.getElementById("formMsg");
      var btn = document.getElementById("submitBtn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.className = "msg";
        msg.textContent = "";

        var email = document.getElementById("email").value.trim().toLowerCase();
        var ref = refInput.value.trim().toUpperCase();

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          msg.className = "msg err";
          msg.textContent = "Enter a valid email.";
          return;
        }

        var entries = loadEntries();
        if (entries.some(function (x) { return x.email === email; })) {
          msg.className = "msg ok";
          msg.textContent = "You’re already in. We’ll ping you when it’s time.";
          return;
        }

        btn.disabled = true;
        entries.push({
          email: email,
          ref: ref || null,
          at: new Date().toISOString()
        });
        saveEntries(entries);

        // Hook for Laravel later: POST /api/waitlist { email, ref }
        msg.className = "msg ok";
        msg.textContent = ref
          ? "You’re in. Crew code " + ref + " locked to your spot."
          : "You’re in. Watch your inbox.";
        form.reset();
        if (fromUrl) refInput.value = fromUrl.toUpperCase();
        btn.disabled = false;
      });

      /* —— Live BTC (USD) —— */
      var btcPriceEl = document.getElementById("btcPrice");
      var btcLiveEl = document.getElementById("btcLive");
      var btcTeaser = document.getElementById("btcTeaser");
      var hudBtc = document.getElementById("hudBtc");
      var hudBtcPrice = document.getElementById("hudBtcPrice");
      var lastBtc = null;

      function formatUsd(n) {
        try {
          return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD",
            maximumFractionDigits: 0
          }).format(n);
        } catch (e) {
          return "$" + Math.round(n).toLocaleString("en-US");
        }
      }

      function applyPrice(n) {
        lastBtc = n;
        var formatted = formatUsd(n);
        btcPriceEl.textContent = formatted;
        hudBtcPrice.textContent = formatted;
        btcLiveEl.textContent = "Live";
        btcTeaser.classList.remove("stale");
        hudBtc.classList.remove("stale");
      }

      function markStale() {
        if (lastBtc != null) {
          btcLiveEl.textContent = "Cached";
        } else {
          btcPriceEl.textContent = "—";
          hudBtcPrice.textContent = "—";
          btcLiveEl.textContent = "Offline";
        }
        btcTeaser.classList.add("stale");
        hudBtc.classList.add("stale");
      }

      function fetchBinance() {
        return fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT", {
          cache: "no-store"
        }).then(function (r) {
          if (!r.ok) throw new Error("binance " + r.status);
          return r.json();
        }).then(function (d) {
          var n = parseFloat(d.price);
          if (!isFinite(n) || n <= 0) throw new Error("bad price");
          return n;
        });
      }

      function fetchCoinGecko() {
        return fetch(
          "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd",
          { cache: "no-store" }
        ).then(function (r) {
          if (!r.ok) throw new Error("coingecko " + r.status);
          return r.json();
        }).then(function (d) {
          var n = d && d.bitcoin && d.bitcoin.usd;
          n = parseFloat(n);
          if (!isFinite(n) || n <= 0) throw new Error("bad price");
          return n;
        });
      }

      function refreshBtc() {
        fetchBinance()
          .catch(function () { return fetchCoinGecko(); })
          .then(applyPrice)
          .catch(markStale);
      }

      refreshBtc();
      setInterval(refreshBtc, BTC_REFRESH_MS);
    })();
  </script>
</body>
</html>
